# Set up for running a database locally
version: '3.8'
services:
    db:
        image: pgvector/pgvector:pg16
        container_name: pain_prism_db
        restart: always
        environment:
            POSTGRES_USER: myuser
            POSTGRES_PASSWORD: mypassword
            POSTGRES_DB: pain_prism
        # Use 5433 on host so we don't conflict with native Windows Postgres on 5432
        ports:
            - '5433:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data

volumes:
    postgres_data:
