# Set up for running a database locally
version: '3.8'
services:
    db:
        image: pgvector/pgvector:pg16
        container_name: pain_prism_db
        restart: always
        environment:
            POSTGRES_USER: myuser
            POSTGRES_PASSWORD: mypassword
            POSTGRES_DB: pain_prism
        ports:
            - '5432:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data

volumes:
    postgres_data:
